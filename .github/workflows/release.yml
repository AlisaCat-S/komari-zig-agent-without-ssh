name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag or version, for example v0.1.0 or 0.1.0"
        required: true

permissions:
  actions: write
  contents: write

env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve and create tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            workflow_run)
              [ "$WORKFLOW_CONCLUSION" = "success" ]
              [ "$WORKFLOW_EVENT" = "push" ]
              [ -n "$WORKFLOW_HEAD_SHA" ]
              tag="v0.0.0-main.${WORKFLOW_RUN_NUMBER}"
              source_ref="$WORKFLOW_HEAD_SHA"
              create_tag=true
              ;;
            workflow_dispatch)
              tag="$MANUAL_TAG"
              source_ref="HEAD"
              create_tag=true
              ;;
            push)
              tag="$PUSHED_TAG"
              source_ref="$PUSHED_TAG"
              create_tag=false
              ;;
            *)
              echo "Unsupported trigger: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          tag="${tag#refs/tags/}"
          case "$tag" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0" >&2
            exit 1
          fi

          git fetch --tags --force
          current="$(git rev-parse "${source_ref}^{commit}")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${current}" >> "$GITHUB_OUTPUT"

          if [ "$create_tag" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              existing="$(git rev-list -n 1 "${tag}")"
              if [ "$existing" != "$current" ]; then
                echo "Tag ${tag} already exists at ${existing}, not current commit ${current}" >&2
                exit 1
              fi
            else
              git tag -a "$tag" "$current" -m "Release $tag"
              git push origin "refs/tags/${tag}"
            fi
          fi

  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            target: x86_64-linux-musl
          - os: linux
            arch: arm64
            target: aarch64-linux-musl
          - os: linux
            arch: "386"
            target: x86-linux-musl
          - os: linux
            arch: arm
            target: arm-linux-musleabi
          - os: linux
            arch: mips
            target: mips-linux-musleabi
          - os: linux
            arch: mipsel
            target: mipsel-linux-musleabi
          - os: linux
            arch: mips64
            target: mips64-linux-muslabi64
          - os: linux
            arch: mips64el
            target: mips64el-linux-muslabi64
          - os: linux
            arch: riscv64
            target: riscv64-linux-musl
          - os: linux
            arch: s390x
            target: s390x-linux-musl
          - os: linux
            arch: loong64
            target: loongarch64-linux-musl
          - os: freebsd
            arch: amd64
            target: x86_64-freebsd
          - os: freebsd
            arch: arm64
            target: aarch64-freebsd
          - os: freebsd
            arch: "386"
            target: x86-freebsd
          - os: freebsd
            arch: arm
            target: arm-freebsd
          - os: darwin
            arch: amd64
            target: x86_64-macos
          - os: darwin
            arch: arm64
            target: aarch64-macos
          - os: windows
            arch: amd64
            target: x86_64-windows-gnu
          - os: windows
            arch: arm64
            target: aarch64-windows-gnu
          - os: windows
            arch: "386"
            target: x86-windows-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - name: Install Zig
        shell: bash
        run: |
          set -eu
          bash scripts/install_zig_ci.sh "zig-x86_64-linux-${ZIG_VERSION}.tar.xz" "${ZIG_SHA256}"
      - name: Build
        run: |
          set -eu
          dsm_flags=""
          if [ "${{ matrix.os }}" = linux ]; then
            case "${{ matrix.arch }}" in amd64|arm64|arm) dsm_flags="-Ddsm-ui=true" ;; esac
          fi
          zig build -Doptimize=ReleaseSmall -Dversion=${{ needs.prepare.outputs.tag }} -Dtarget=${{ matrix.target }} $dsm_flags
          mkdir -p dist
          if [ -n "$dsm_flags" ]; then
            cp zig-out/bin/komari-dsm-api.cgi "dist/komari-dsm-api-linux-${{ matrix.arch }}.cgi"
          fi
          binary="komari-agent"
          asset="komari-agent-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            binary="komari-agent.exe"
            asset="${asset}.exe"
          fi
          cp "zig-out/bin/${binary}" "dist/${asset}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: komari-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Add installer and deployment files
        run: |
          set -eu
          cp install.sh dist/install.sh
          chmod 0755 dist/install.sh
          cp install.ps1 dist/install.ps1
          cp deploy/komari-agent.service dist/komari-agent.service
          cp deploy/config.json.example dist/config.json.example
      - name: Build DSM 7 packages
        env:
          AGENT_VERSION: ${{ needs.prepare.outputs.tag }}
          PACKAGE_BUILD: ${{ github.run_number }}
        run: |
          set -eu
          python3 scripts/test_synology.py -v
          for arch in amd64 arm64 arm; do
            python3 scripts/build_synology_spk.py --binary "dist/komari-agent-linux-$arch" \
              --cgi "dist/komari-dsm-api-linux-$arch.cgi" --arch "$arch" --version "$AGENT_VERSION" --build-number "$PACKAGE_BUILD" --output-dir dist
          done
          KOMARI_TEST_AGENT=dist/komari-agent-linux-amd64 KOMARI_TEST_CGI=dist/komari-dsm-api-linux-amd64.cgi python3 scripts/test_synology.py -v
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          (cd dist && sha256sum komari-agent-* install.sh install.ps1 komari-agent.service config.json.example > SHA256SUMS)
          gh release upload "$TAG" dist/komari-agent-* dist/install.sh dist/install.ps1 dist/komari-agent.service dist/config.json.example dist/SHA256SUMS --clobber

  fanout:
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    steps:
      - name: Trigger release notes workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          gh workflow run "Release notes from commits" --repo "$GH_REPO" -f release_tag="$TAG"
      - name: Trigger docker publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          gh workflow run "Publish Docker Image" --repo "$GH_REPO" -f version="$TAG" -f source_ref="$TAG"
