<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Komari Monitor</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><img src="images/icon_64.png" width="44" height="44" alt=""><div><h1>Komari Monitor</h1><p>NAS 监控 · 仅上报</p></div></div>
      <button id="refresh" class="secondary" type="button">刷新状态</button>
    </header>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <main>
      <section class="status-panel" aria-labelledby="status-title">
        <div class="eyebrow">运行概览 <span id="poll-state">正在读取</span></div>
        <div class="headline"><span id="state-dot" class="dot neutral"></span><h2 id="status-title">正在获取状态</h2></div>
        <p id="status-description" class="muted">验证 DSM 管理员会话后显示实时状态。</p>
        <div class="metrics">
          <div><p>最近发送</p><strong id="last-sent">—</strong><small id="sent-date">尚无发送记录</small></div>
          <div><p>本次运行已发送</p><strong id="sent-count">—</strong><small>条监控报告</small></div>
        </div>
        <dl class="details">
          <div><dt>Agent 进程</dt><dd id="process">—</dd></div>
          <div><dt>当前传输</dt><dd id="transport">—</dd></div>
          <div><dt>基础信息确认</dt><dd id="basic-confirmed">—</dd></div>
          <div><dt>HTTP 报告确认</dt><dd id="http-confirmed">—</dd></div>
          <div><dt>本次启动</dt><dd id="started">—</dd></div>
        </dl>
        <div id="last-error-box" class="error-box" hidden><span>最近错误</span><p id="last-error"></p></div>
        <p class="footnote">WebSocket 统计表示发送完成，不代表面板已确认接收。HTTP 确认单独记录。</p>
      </section>
      <section class="settings-panel" aria-labelledby="settings-title">
        <div class="section-heading"><h2 id="settings-title">连接设置</h2><span id="edit-state">未修改</span></div>
        <form id="settings">
          <fieldset id="fields" disabled>
            <label for="endpoint">面板地址</label>
            <input id="endpoint" name="endpoint" type="url" placeholder="https://panel.example" autocomplete="off" required maxlength="2048">
            <label for="token">Agent Token <span>留空保留当前值</span></label>
            <input id="token" name="token" type="password" placeholder="未读取凭据" autocomplete="new-password" maxlength="4096">
            <div class="field-row">
              <div><label for="interval">上报间隔 <span>秒</span></label><input id="interval" name="interval" type="number" min="0.1" max="86400" step="0.1" required></div>
              <div><label for="protocol">协议版本</label><select id="protocol" name="protocol_version"><option value="2">V2（推荐）</option><option value="1">V1</option></select></div>
            </div>
            <details class="advanced"><summary>网卡与挂载点</summary>
              <label for="include-nics">包含网卡 <span>逗号分隔，优先于排除</span></label><input id="include-nics" name="include_nics" placeholder="例如 eth*,bond0；留空使用默认范围" maxlength="2048">
              <label for="exclude-nics">排除网卡 <span>逗号分隔，支持 *</span></label><input id="exclude-nics" name="exclude_nics" placeholder="例如 wlan*,eth1" maxlength="2048">
              <label for="mountpoints">监控挂载点 <span>分号分隔</span></label><input id="mountpoints" name="include_mountpoints" placeholder="例如 /volume1;/volume2" maxlength="2048">
            </details>
            <div class="save-area"><div class="save-actions"><button id="save" type="submit" disabled>保存并应用</button><button id="discard" class="secondary" type="button" disabled>放弃更改</button></div><p id="save-hint">运行中保存会重启 Agent，短暂中断上报。</p></div>
          </fieldset>
        </form>
      </section>
    </main>
    <footer><span>通过 DSM 管理员会话访问</span><span>状态每 3 秒刷新 · 凭据不回显</span></footer>
  </div>
</body>
</html>
